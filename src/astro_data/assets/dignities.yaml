# Central dignity metadata corpus for astrology-tool
# Keys are body names; values contain domicile, exaltation, detriment, fall.
# Exaltation is degree-sensitive; domicile/detriment/fall are sign-based.
# Optional exaltation_degree / exaltation_orb default to 2.0 if omitted.

